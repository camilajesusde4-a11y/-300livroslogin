<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Acesso ao Pack de Livros</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: #050505;
      color: #ffffff;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .login {
      width: 100%;
      max-width: 390px;
    }

    .top {
      text-align: center;
      margin-bottom: 32px;
    }

    .tag {
      color: #69bdf5;

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 10px;
    }

    h1 {
      font-size: 34px;
      line-height: 1.05;

      font-weight: 900;

      letter-spacing: -1px;
    }

    .description {
      max-width: 320px;

      margin: 12px auto 0;

      color: #9da4ab;

      font-size: 14px;
      line-height: 1.6;
    }

    .form {
      padding-top: 25px;

      border-top: 1px solid #242424;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #d9d9d9;

      font-size: 12px;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 52px;

      margin-bottom: 17px;

      padding: 0 15px;

      border: 1px solid #292929;
      border-radius: 8px;

      outline: none;

      background: #101010;
      color: #ffffff;

      font-size: 15px;

      transition: .2s;
    }

    input:focus {
      border-color: #69bdf5;

      box-shadow:
        0 0 0 3px rgba(105, 189, 245, .08);
    }

    input::placeholder {
      color: #666;
    }

    button {
      width: 100%;
      height: 55px;

      margin-top: 5px;

      border: 0;
      border-radius: 8px;

      background: #69bdf5;
      color: #06121b;

      font-size: 14px;
      font-weight: 900;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        transform .15s ease,
        background .15s ease;
    }

    button:hover {
      background: #86caf7;
    }

    button:active {
      transform: scale(.98);
    }

    .erro {
      display: none;

      margin-top: 16px;

      padding: 11px;

      border: 1px solid #512323;
      border-radius: 7px;

      background: #1c0d0d;
      color: #ff7070;

      font-size: 12px;

      text-align: center;
    }

    .download-screen {
      min-height: 100vh;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050505;

      text-align: center;
    }

    .download-screen h1 {
      color: #ffffff;

      font-size: 28px;
      font-weight: 800;

      letter-spacing: -.5px;
    }

    .download-screen span {
      color: #69bdf5;
    }

  </style>
</head>


<body>

  <main class="login" id="login">

    <div class="top">

      <div class="tag">
        Biblioteca Digital
      </div>

      <h1>
        Acesso ao Pack
      </h1>

      <p class="description">
        Informe seu usuário e senha para acessar
        seus livros digitais.
      </p>

    </div>


    <form class="form" id="loginForm">

      <label for="usuario">
        USUÁRIO
      </label>

      <input
        type="text"
        id="usuario"
        placeholder="Digite seu usuário"
        autocomplete="username"
        required
      >


      <label for="senha">
        SENHA
      </label>

      <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
      >


      <button type="submit">
        ENTRAR
      </button>


      <div class="erro" id="erro">
        Usuário ou senha incorretos.
      </div>

    </form>

  </main>


  <script>

    /* ===============================
       CONFIGURAÇÕES
    =============================== */

    const USUARIO_CORRETO = "clientePDF";
    const SENHA_CORRETA = "PDFcliente";

    const ARQUIVO_PDF =
      "./arquivos/pack-livros.pdf";


    /* ===============================
       LOGIN
    =============================== */

    const form =
      document.getElementById("loginForm");

    const erro =
      document.getElementById("erro");


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const usuario =
          document
          .getElementById("usuario")
          .value
          .trim();


        const senha =
          document
          .getElementById("senha")
          .value;


        if (
          usuario === USUARIO_CORRETO &&
          senha === SENHA_CORRETA
        ) {

          iniciarDownload();

        } else {

          erro.style.display = "block";

        }

      }
    );


    /* ===============================
       DOWNLOAD
    =============================== */

    function iniciarDownload() {

      document.body.innerHTML = `
        <div class="download-screen">
          <h1>
            Baixando<span>...</span>
          </h1>
        </div>
      `;


      const link =
        document.createElement("a");


      link.href =
        ARQUIVO_PDF;


      link.download =
        "Pack-de-Livros.pdf";


      link.style.display =
        "none";


      document.body.appendChild(link);


      link.click();


      link.remove();

    }

  </script>

</body>

</html>
